<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="squircle">
      <rect x="32" y="32" width="448" height="448" rx="100" ry="100" />
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base App Tile with clipping -->
  <g clip-path="url(#squircle)">
    <!-- Top-Left Green Area -->
    <rect x="32" y="32" width="448" height="448" fill="#1e8e3e" />
    
    <!-- White / Grey Map Roads Background (Right side) -->
    <path d="M 240 32 L 480 32 L 480 480 L 380 480 Z" fill="#e8eaed" />
    
    <!-- Bottom-Left Blue Region -->
    <path d="M 32 400 L 32 480 L 400 480 L 260 340 Z" fill="#1a73e8" />
    
    <!-- Diagonal Yellow Street Highway -->
    <polygon points="32,450 60,480 480,140 480,80" fill="#fbbc04" />
    <polygon points="32,420 480,60 480,90 32,450" fill="#f9ab00" opacity="0.3" />

    <!-- Google G Logo in Upper Left -->
    <path d="M 180 140 A 60 60 0 1 0 180 240 A 60 60 0 0 0 230 200 L 175 200 L 175 175 L 255 175 A 78 78 0 1 1 180 115 A 80 80 0 0 1 236 138 L 218 156 A 55 55 0 0 0 180 140 Z" fill="#ffffff" />
  </g>

  <!-- Big Red Google Maps Pin -->
  <g filter="url(#shadow)">
    <!-- Pin Body -->
    <path d="M 380 36 C 314 36 260 90 260 156 C 260 240 360 365 374 382 C 377 386 383 386 386 382 C 400 365 500 240 500 156 C 500 90 446 36 380 36 Z" fill="#ea4335" />
    
    <!-- Darker Pin Inner Dot -->
    <circle cx="380" cy="156" r="46" fill="#b31412" />
  </g>
</svg>
